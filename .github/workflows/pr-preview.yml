# Per-PR app preview — the "Vercel-style" half of the workflow that pgoverlay
# deliberately doesn't do. pgoverlay (via ghook) creates the per-PR DATABASE
# branch; this job deploys the APP for the PR, points it at that branch, and
# posts a preview-URL comment.
#
# Cluster-agnostic via repo variables/secrets:
#   vars.PREVIEW_ENABLED  = "true"        gate
#   vars.PGOVERLAY_API    = https://<branchd API LB>:7070
#   vars.PREVIEW_URL      = http://<orders-api app LB>:8090
#   secrets.KUBECONFIG_B64  = base64 kubeconfig (scoped SA token; public API)
#   secrets.PGOVERLAY_TOKEN = branchd bearer token
#
# On EKS the API/LBs are public, so no tunnel is needed. (The earlier k3s
# variant joined the tailnet first; that step is gone.)
#
# ARCHIVED. The EKS cluster was decommissioned in June 2026 — the branchd API
# and the app LoadBalancer named in vars.PGOVERLAY_API / vars.PREVIEW_URL no
# longer resolve, so this cannot deploy anything and no longer runs on
# `pull_request`. Kept in-tree as the reference wiring. To revive it, point
# the variables below at a live cluster and restore the `pull_request:`
# trigger.
name: pr-preview
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to deploy a preview for and comment on'
        required: true
        type: string
      branch_ref:
        description: 'Git ref of that PR (e.g. feat/order-tags)'
        required: true
        type: string

concurrency: pr-preview

permissions:
  pull-requests: write
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      PGOVERLAY_SERVER: ${{ vars.PGOVERLAY_API }}
      PROXY_SVC: pgoverlay-proxy.pgoverlay.svc.cluster.local
      PREVIEW_URL: ${{ vars.PREVIEW_URL }}
    steps:
      - uses: actions/checkout@v4

      # was a job-level `if: vars.PREVIEW_ENABLED == 'true'`, which turned an
      # unconfigured repo into a green-looking skip. Fail loudly instead.
      - name: Preflight — require a live cluster to deploy to
        run: |
          if [ "${{ vars.PREVIEW_ENABLED }}" != "true" ]; then
            echo "::error::vars.PREVIEW_ENABLED is not 'true' — previews are off."
            echo "The EKS cluster this demo used was decommissioned in June 2026."
            exit 1
          fi
          for v in PGOVERLAY_SERVER PREVIEW_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty"; exit 1; fi
          done

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          kubectl get ns demo >/dev/null 2>&1 || kubectl create ns demo

      - name: Derive branch + wait for its pgoverlay database
        id: db
        env:
          # via env, never interpolated into the script body: a git ref is
          # attacker-controlled text and `${{ }}` splices it in before the
          # shell ever sees it
          BRANCH_REF: ${{ inputs.branch_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PGOVERLAY_TOKEN: ${{ secrets.PGOVERLAY_TOKEN }}
        run: |
          # the name pgoverlay-github gave the PR's branch (git-branch naming,
          # falling back to the PR number): gh-<repo-key>-<ref>
          BRANCH=$(./scripts/pgoverlay-branch.sh "$GITHUB_REPOSITORY" "$BRANCH_REF" "$PR_NUMBER")
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Waiting for pgoverlay branch '$BRANCH' (created by the webhook)…"
          for i in $(seq 1 60); do
            J=$(curl -s -H "Authorization: Bearer $PGOVERLAY_TOKEN" "$PGOVERLAY_SERVER/v1/branches/$BRANCH" || true)
            if [ "$(echo "$J" | jq -r '.state // empty')" = "ready" ]; then
              echo "branch is ready"; exit 0
            fi
            sleep 5
          done
          echo "branch never became ready"; exit 1

      - name: Deploy preview app
        env:
          # inherit-mode: branches share the source password (rotation off,
          # which is what static-env preview flows like Vercel also need)
          PGPASSWORD: ${{ secrets.PGOVERLAY_DB_PASSWORD }}
        run: |
          BRANCH=${{ steps.db.outputs.branch }}
          DSN="host=$PROXY_SVC port=6432 user=postgres password=$PGPASSWORD dbname=postgres@$BRANCH sslmode=disable"
          kubectl -n demo create secret generic orders-db \
            --from-literal=dsn="$DSN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n demo apply -f - <<YAML
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: orders-api, labels: { app: orders-api } }
          spec:
            replicas: 1
            selector: { matchLabels: { app: orders-api } }
            template:
              metadata: { labels: { app: orders-api } }
              spec:
                containers:
                - name: app
                  image: ghcr.io/abd-ulbasit/orders-api:v1
                  ports: [{ containerPort: 8090 }]
                  env:
                  - { name: BRANCH, value: "$BRANCH" }
                  - name: DATABASE_URL
                    valueFrom: { secretKeyRef: { name: orders-db, key: dsn } }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: orders-api }
          spec:
            type: LoadBalancer
            selector: { app: orders-api }
            ports: [{ port: 8090, targetPort: 8090 }]
          YAML
          kubectl -n demo rollout restart deploy/orders-api
          kubectl -n demo rollout status deploy/orders-api --timeout=150s

      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.db.outputs.branch }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr_number }}
        run: |
          case "$PR" in
            ''|*[!0-9]*) echo "::error::pr_number must be numeric, got '$PR'"; exit 1 ;;
          esac
          MARKER="<!-- pr-preview -->"
          BODY="$MARKER
          ### 🚀 Preview deployment (self-hosted on EKS)

          | | |
          |---|---|
          | **App** | orders-api |
          | **Status** | ✅ Ready |
          | **Preview** | ${PREVIEW_URL}/db |
          | **Database branch** | \`${BRANCH}\` |

          Running in the EKS cluster, reading its per-PR pgoverlay database."
          ID=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi
          echo "preview comment posted"
