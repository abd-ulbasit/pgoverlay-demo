# Runs the repo's migrations against a PR's pgoverlay database branch — real
# production-shaped data, created in ~2s by the pgoverlay webhook when the PR
# was opened. This is the job that produced PR #1's recorded failure.
#
# ARCHIVED. The demo's EKS cluster was decommissioned in June 2026, so there
# is no pgoverlay proxy left for this to reach and it no longer runs on
# `pull_request`. It is kept in-tree as the reference wiring: this file is
# what "CI runs your migrations against a branch of prod" actually looks like.
#
# It last did real work on 2026-06-11 (10 successful runs, plus 2 genuine
# failures on feat/signup-stats). From 2026-06-13 it skipped every single run,
# because the job gated on `vars.PGOVERLAY_PROXY_HOST` and the move to EKS
# stopped setting that variable — the gate silently went permanently false.
# That silent-skip gate is gone: the preflight below fails loudly instead, so
# a run can never again look like it passed when it did nothing.
#
# To use it against your own pgoverlay install, set:
#   vars.PGOVERLAY_PROXY_HOST      e.g. "pgoverlay.internal:6432"
#   vars.PGOVERLAY_PG_USER         optional, defaults to "postgres"
#   secrets.PGOVERLAY_PG_PASSWORD
# and add the `pull_request:` trigger back (then feed BRANCH_REF from
# github.head_ref and PR_NUMBER from github.event.pull_request.number).
#
# The branch name is derived by scripts/pgoverlay-branch.sh, the same rule
# pgoverlay-github uses to create it: gh-<repo-key>-<ref> or
# gh-<repo-key>-pr-<n>, where <repo-key> is 6 hex chars of the repository's
# SHA-256.
name: pr-db-check
on:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: 'Head branch of the PR whose pgoverlay database to migrate (e.g. feat/order-tags; ghook git-branch naming). Leave empty to use pr_number.'
        required: false
        type: string
      pr_number:
        description: 'PR number (ghook pr-number naming, its default; also the fallback for fork PRs)'
        required: false
        type: string

jobs:
  migrate-against-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — require the pgoverlay proxy to be configured
        env:
          PGOVERLAY_PROXY_HOST: ${{ vars.PGOVERLAY_PROXY_HOST }}
        run: |
          if [ -z "$PGOVERLAY_PROXY_HOST" ]; then
            echo "::error::vars.PGOVERLAY_PROXY_HOST is not set — there is no pgoverlay proxy to migrate against."
            echo "The demo cluster this repo used was decommissioned in June 2026."
            echo "Set vars.PGOVERLAY_PROXY_HOST and secrets.PGOVERLAY_PG_PASSWORD to point at your own install."
            exit 1
          fi
          echo "pgoverlay proxy: $PGOVERLAY_PROXY_HOST"

      - name: Apply migrations to the branch's database
        env:
          PGOVERLAY_PROXY_HOST: ${{ vars.PGOVERLAY_PROXY_HOST }}
          PGPASSWORD: ${{ secrets.PGOVERLAY_PG_PASSWORD }}
          # via env, never interpolated into the script body: a git ref is
          # attacker-controlled text
          BRANCH_REF: ${{ inputs.branch_ref }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          export PGHOST="${PGOVERLAY_PROXY_HOST%%:*}"
          export PGPORT="${PGOVERLAY_PROXY_HOST##*:}"
          export PGUSER="${{ vars.PGOVERLAY_PG_USER || 'postgres' }}"
          # the database name routes through the pgoverlay proxy to the PR's
          # branch. ghook names it gh-<repo-key>-<ref> (git-branch naming) or
          # gh-<repo-key>-pr-<n> (pr-number naming); the script applies the
          # exact rule, including the repository key.
          BRANCH=$(./scripts/pgoverlay-branch.sh "$GITHUB_REPOSITORY" "$BRANCH_REF" "$PR_NUMBER")
          export PGDATABASE="postgres@$BRANCH"
          echo "migrating $PGDATABASE"
          # the webhook acks instantly and creates the branch async (~10-15s
          # as a pod) — wait for it to accept connections before migrating
          for i in $(seq 1 24); do
            psql -qAtc "SELECT 1" >/dev/null 2>&1 && break
            echo "waiting for branch database ($i)..."; sleep 5
          done
          # if it never came up, fail here rather than letting migrate.sh
          # report a confusing connection error
          psql -qAtc "SELECT 1" >/dev/null
          ./scripts/migrate.sh
